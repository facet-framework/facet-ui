schema_version: "0.1"
id: interface/controls/selection
lifecycle: active
intent:
  summary: Segments and tabs expose a controlled choice and report when a user picks another option.
contract:
  scenarios:
    - id: segments
      statement: |
        Given a Segment with a selected option
        When the user clicks a different option
        Then the original option exposes checked state before the click and the callback receives the clicked value
    - id: tabs
      statement: |
        Given Tabs with a selected item
        When the user clicks a different tab
        Then the original tab exposes selected state before the click and the callback receives the clicked value
verification:
  integration_tests:
    - id: "src/facet/primitives/primitives.spec.tsx::reports the picked segment and tab"
      proves:
        - segments
        - tabs
knowledge:
  discoverability:
    question: Where can I use this capability?
    answer: "Import Segment or Tabs from @facet-tools/ui."
lineage:
  owner:
    team: Unknown
  created_at: "2026-11-20"
