schema_version: "0.1"
id: foundations/styling/theme-palettes
lifecycle: active
intent:
  summary: Applications can select either palette in light or dark mode and scope it to a section of the page.
contract:
  scenarios:
    - id: explicit-palette
      statement: |
        Given a scope with data-t-theme set to paper and data-t-mode set to light
        When the design system stylesheet applies
        Then components in the scope use the paper light palette variables
    - id: default-palette
      statement: |
        Given a .t-app element without a theme attribute or themed ancestor
        When the design system stylesheet applies
        Then the element defines the facet dark palette variables
knowledge:
  discoverability:
    question: Where can I use this capability?
    answer: "Load @facet-tools/ui/styles.css and set the theme and mode on AppShell or an ancestor."
lineage:
  owner:
    team: Unknown
  created_at: "2026-11-20"
