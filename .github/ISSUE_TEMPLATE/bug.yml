name: Bug report
description: Report a reproducible defect with a minimal example.
title: "Bug: "
body:
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: Include the release tag, operating system and architecture.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction, expected result and actual result
      description: Use synthetic data. Do not include credentials or private project contents. Report vulnerabilities through SECURITY.md.
    validations:
      required: true
