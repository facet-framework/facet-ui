name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.repository == 'facet-framework/facet-ui')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Release dry runs must run from refs/heads/main"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the release candidate
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er '.version | strings' package.json)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            result=0
            sh scripts/release-pr-check.sh --if-release "$version" "$GITHUB_REPOSITORY" || result=$?
            case "$result" in
              0) ;;
              3) exit 0 ;;
              *) exit "$result" ;;
            esac
          else
            sh scripts/release-version.sh "$version"
          fi
          printf 'version=%s\ntag=v%s\n' "$version" "$version" >> "$GITHUB_OUTPUT"
      - name: Check release protections before any deployment
        if: github.event_name == 'push' && steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
        run: sh scripts/release-environment-check.sh release
      - name: Wait for CI on the squash commit
        if: github.event_name == 'push' && steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=1"
          for attempt in {1..120}; do
            conclusion=$(gh api --method GET "$endpoint" --jq '.workflow_runs[0].conclusion // ""')
            case "$conclusion" in
              success) echo "CI succeeded on $GITHUB_SHA"; exit 0 ;;
              '') sleep 20 ;;
              *) echo "::error::CI on $GITHUB_SHA concluded $conclusion"; exit 1 ;;
            esac
          done
          echo "::error::Timed out waiting for CI on $GITHUB_SHA"
          exit 1

  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test:coverage --runInBand
      - name: Pack and checksum the npm tarball
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir out
          npm pack --pack-destination out
          (cd out && sha256sum -- "facet-tools-ui-$VERSION.tgz" > checksums.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    if: github.event_name == 'push'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: out
      - run: sh scripts/release-assets-check.sh "$VERSION" out
      - name: Recheck release protections
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
        run: sh scripts/release-environment-check.sh release
      - name: Tag the approved squash commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/release-tag.sh "$VERSION" "$GITHUB_REPOSITORY"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: out/checksums.txt
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/release-publish.sh "$VERSION" "$GITHUB_REPOSITORY" out

  npm-dispatch:
    needs: [plan, publish]
    if: vars.FACET_NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Request npm staging
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if ! gh workflow run npm.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$TAG"; then
            echo "::warning::npm dispatch failed. Run: gh workflow run npm.yml --repo $GITHUB_REPOSITORY --ref main -f tag=$TAG"
          fi
