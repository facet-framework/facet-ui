name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json, for example 0.1.0-rc.2
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases run from main, not ${GITHUB_REF}." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          actual=$(node -p 'require("./package.json").version')
          if [ "$actual" != "$VERSION" ]; then
            echo "package.json has version $actual, not $VERSION." >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test:coverage --runInBand
      - name: Pack
        id: pack
        run: |
          mkdir -p out
          npm pack --pack-destination out
          tarball=$(cd out && ls -- *.tgz)
          (cd out && sha256sum -- "$tarball" > checksums.txt && cat checksums.txt)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/
          if-no-files-found: error

  npm:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: out
      - name: Verify the tarball
        run: (cd out && sha256sum --check --strict checksums.txt)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - name: Stage for publication
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm stage publish "out/$TARBALL" --tag next --access public --provenance
