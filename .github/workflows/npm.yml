name: npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published FACET UI version tag (v*)
        type: string
        required: true
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::npm staging must run from refs/heads/main"
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != facet-framework/facet-ui ]]; then
            echo "::error::npm staging must run in facet-framework/facet-ui"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" != v* ]]; then
            echo "::error::Expected a v-prefixed release tag"
            exit 1
          fi
          sh scripts/release-version.sh "${TAG#v}"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
      - name: Check the npm environment before deployment
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
        run: sh scripts/release-environment-check.sh npm

  stage:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      attestations: read
      id-token: write
    concurrency:
      group: npm-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          path: release-source
          persist-credentials: false
      - name: Download and verify the GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/release-npm-assets.sh "$TAG" "$GITHUB_REPOSITORY" release-source "$RUNNER_TEMP/facet-ui"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - name: Stage the package for npm approval
        run: sh scripts/release-npm-publish.sh "${TAG#v}" "$RUNNER_TEMP/facet-ui"
